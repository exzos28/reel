    help: reel also searches releases by this title.
    more: More languages
  buffer:
    title: How much space can reel use while playing?
    help: A bigger buffer copes better with slow peers and long jumps.
    recommended: Recommended
  source:
    title: Where should reel find films?
    help: Enter your own, or get a ready one.
    own_title: Your own source
    rent_title: Or get a ready one
    check: Check
    finish: Finish
    skip: Skip
    footnote: "Torznab is a common way for search services to list torrent releases. reel does not search for video itself: it is a catalogue and a player, and finds what to play only through the source you give it."
  phone:
    title: Or set it up on your phone
    text: "Scan the code with the phone's camera, or open %{url} in its browser. This screen follows along."
    source_title: Easier on your phone
    source_text: "Typing an address with a remote is slow. Scan the code, or open %{url}, and paste it there. This screen finishes by itself."

