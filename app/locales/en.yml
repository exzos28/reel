settings:
  title: Settings
  hint: "OK chooses, Back closes."
  selected: Selected
  language:
    title: Language
    about: The language of titles, descriptions and episode names. reel also searches releases by the title in this language, then by the original one. The app itself stays in English.
  source:
    title: Search source
    about: Where reel looks for releases of a film or an episode. Enter the Torznab address of your own Jackett (or Prowlarr, JacRed…) and its API key. reel comes with no source of its own.
    url: Address
    url_placeholder: "http://192.168.1.10:9117/api/v2.0/indexers/all/results/torznab/api"
    key: API key
    key_placeholder: The key from your Jackett dashboard (if it has one)
    key_saved: Key saved. Type a new one to replace it
    save: Save and check
    saving: Saving…
    checking: Checking the source…
    removed: Search source removed.
    ok_imdb: Connected. It searches by IMDb id.
    ok_text: Connected. It searches by title.
    failed: "Could not reach the source: %{message}"
  about:
    title: About reel
    open: About reel and its data sources
    data: Data sources
    tmdb_logo: The Movie Database (TMDB)
  details:
    title: Stream details
    about: While a film plays or waits, show how fast it comes, from how many people, and how much is ready ahead.
    show: Show stream details
  buffer:
    title: Playback buffer
    about: How much of the film reel keeps on this device while it plays. A bigger buffer survives slow peers and long seeks better. reel needs this much free space to start a film.
    free: "%{free} free on this device"
    default: (default)

