settings:
  title: Settings
  selected: Selected
  language:
    title: Language
    about: Titles, descriptions and episode names; reel also searches releases by them.
  source:
    title: Search source
    about: Where reel looks for releases of a film or an episode. A Torznab address and its API key.
    phone: "Scan the code with your phone, or open %{url}"
    # The address is what a source needs; a key only some have (a rented one is all in its address).
    url: Torznab address (required)
    url_placeholder: "http://192.168.1.10:9117/api/v2.0/indexers/all/results/torznab/api"
    key: API key (optional)
    key_placeholder: Only if your source has one
    key_saved: Key saved. Type a new one to replace it
    save: Save and check
    remove: Remove source
    # The partner's ready source (design/partner-source.md).
    partner_tv_title: Get a ready source
    partner_tv_text: "Scan with your phone and pay in Telegram (@%{bot}). The source comes back here: confirm it on this screen."
    partner_app: Get a ready source in Telegram
    partner_app_note: "@%{bot} sends a link back: open it, and the source fills in here."
    saving: Saving…
    checking: Checking the source…
    removed: Search source removed.
    ok_imdb: Connected. It searches by IMDb id.
    ok_text: Connected. It searches by title.
    failed: "Could not reach the source: %{message}"
    # Why a source did not answer (the core's reason), with what to do.
    reason:
      unreachable: "Can't reach %{host}. Check the address, and that the source is on."
      key: "%{host} refused the API key. Check the key."
      not_torznab: "%{host} answered, but not as a Torznab source. Check the address: it usually ends in /torznab/api."
      error: "%{host} said: %{message}"
  # The drawer with the search source's fields: on Play with none (missing), when it did not
  # answer (failed), from Settings (edit).
  source_drawer:
    missing_title: Add a search source
    missing_about: reel plays from releases it finds on your own search source, and there is none yet. Enter a Torznab address and its API key; Play works once it connects.
    failed_title: Your search source did not answer
    failed_about: reel could not search it for releases. Check its address and API key, then Save and check; Play works once it connects.
    edit_title: Search source
    edit_about: A Torznab address and its API key.
    link_title: Use this source?
    link_about: A link filled in this source. Save and check to use it, or Back to leave yours as it is.
  # The rows of Settings: a name and the value in effect.
  rows:
    connected: Connected
    not_set: Not set
    buffer_value: "%{size} · %{free} free"
  # The card beside Settings on a device that serves its settings page (a TV).
  phone:
    title: Change these on your phone
    text: "Scan the code, or open %{url}."
  about:
    title: About reel
    open: About reel and its data sources
    data: Data sources
    tmdb_logo: The Movie Database (TMDB)
    version: "Version %{version} (%{build})"
  details:
    title: Stream details
    about: While a film plays or waits, show how fast it comes, from how many people, and how much is ready ahead.
    show: Show stream details
  buffer:
    title: Playback buffer
    about: How much of the film reel keeps while it plays. Bigger copes better with slow peers and long jumps.
    free: "%{free} free on this device"
    default: (default)


# The first-run setup: language, playback buffer, search source.
setup:
  step: "Step %{n} of 3"
  next: Next
  language:
