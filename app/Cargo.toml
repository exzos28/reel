[package]
name = "reel-app"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]
members = ["domain", "engine"]

[features]
default = ["engine"]
# The torrent engine inside the app (librqbit, the ring-buffer cache, the Torznab source).
# Without it `Playback` answers that there is no engine on this device (app/ARCHITECTURE.md).
engine = ["dep:reel-engine"]

[dependencies]
nsh-core = "0.5.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Everything but the formatting helpers is native only: NSH's web target builds this crate for
# wasm32, where librqbit, tokio networking and sqlite do not build. On a TV the web UI reaches
# these modules over HTTP instead (hosts/tizen, docs/tizen.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Domain types and ports (app/ARCHITECTURE.md).
reel-domain = { path = "domain" }
# The engine inside the app (feature `engine`): librqbit, the ring-buffer cache, the Torznab
# source (app/engine). The vendored librqbit is patched in by .cargo/config.toml.
reel-engine = { path = "engine", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "default-tls"] }
# Shrinking providers' one-size pictures for a TV (src/interface/thumbs.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The QR code on the TV that opens its settings page on a phone (src/hosted).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.42", features = ["bundled"] }
# Pairing codes and sessions of the hosted settings page (src/interface/hosted); already in the tree.
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The mpv video view (`src/adapters/mpv`): a native component on NSH's AppKit host.
libc = "0.2"
nsh-platform-macos = { version = "0.5.0", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAOpenGLLayer", "objc2-open-gl", "objc2-core-video", "objc2-core-foundation"] }
objc2-open-gl = { version = "0.3", features = ["CGLTypes", "CGLCurrent"] }
objc2-core-video = { version = "0.3", features = ["CVBase"] }
objc2-core-foundation = { version = "0.3", features = ["CFDate"] }
