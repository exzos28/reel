[package]
name = "reel-app"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]
members = ["domain", "engine"]

[features]
default = ["engine"]
# The torrent engine inside the app (librqbit, the ring-buffer cache, the Torznab source).
# Without it `Playback` answers that there is no engine on this device (docs/architecture.md).
engine = ["dep:reel-engine"]

[dependencies]
# Logs that reach the platform's log (Android's logcat through NSH), unlike stderr.
tracing = "0.1"
nsh-core = "0.5.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Everything but the formatting helpers is native only: NSH's web target builds this crate for
# wasm32, where librqbit, tokio networking and sqlite do not build. On a TV the web UI reaches
# these modules over HTTP instead (platforms/tizen, docs/tizen.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Domain types and ports (docs/architecture.md).
reel-domain = { path = "domain" }
# The engine inside the app (feature `engine`): librqbit, the ring-buffer cache, the Torznab
# source (app/engine). The vendored librqbit is patched in by .cargo/config.toml.
reel-engine = { path = "engine", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "default-tls"] }
# Shrinking providers' one-size pictures for a TV (src/interface/thumbs.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The QR code on the TV that opens its settings page on a phone (src/hosted).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.42", features = ["bundled"] }
# Pairing codes and sessions of the hosted settings page (src/interface/hosted); already in the tree.
getrandom = "0.3"

[dev-dependencies]
# Reads the `#[module]`s from src/ for the generated map of the core's API (tests/modules_map.rs,
# docs/modules.md); already in the tree.
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The mpv video view (`src/adapters/mpv`): a native component on NSH's AppKit host.
libc = "0.2"
nsh-platform-macos = { version = "0.5.1", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAOpenGLLayer", "objc2-open-gl", "objc2-core-video", "objc2-core-foundation"] }
objc2-open-gl = { version = "0.3", features = ["CGLTypes", "CGLCurrent"] }
objc2-core-video = { version = "0.3", features = ["CVBase"] }
objc2-core-foundation = { version = "0.3", features = ["CFDate"] }

[target.'cfg(target_os = "ios")'.dependencies]
# The mpv video view on iOS (`src/adapters/mpv/ios.rs`): a native component on NSH's UIKit host.
libc = "0.2"
nsh-platform-ios = { version = "0.5.1", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = { version = "0.3", features = ["UIView", "UIResponder", "UIWindow", "UIScreen"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CATransaction", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }

# Linux: libmpv loaded at run time.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Linux desktops: the mpv video view (`src/adapters/mpv/linux.rs`), a GTK GLArea in NSH's GTK 4
# platform. Not 32-bit ARM: that is the Samsung TV's core (platforms/tizen), which has no GTK and draws
# no native views (the TV's AVPlay plays).
[target.'cfg(all(target_os = "linux", not(target_arch = "arm")))'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false }
gtk4 = { version = "0.11", features = ["v4_14"] }

# Windows: the mpv video view (`src/adapters/mpv/windows.rs`), drawn with Direct2D from mpv's Direct3D 11 frames.
[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

# Android: servers' certificates are checked against Mozilla's roots built in (src/http_client.rs).
[target.'cfg(target_os = "android")'.dependencies]
# reel's own native views (src/adapters/android_views.rs): JNI's C interface, as NSH uses.
jni-sys = "0.4"
libc = "0.2"
webpki-root-certs = "1"
