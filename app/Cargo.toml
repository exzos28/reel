[package]
name = "reel-app"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.0"
librqbit = { version = "9.1.0", features = ["http-api", "tracing-subscriber-utils"] }
serde_json = "1"
anyhow = "1"
librqbit-dualstack-sockets = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "default-tls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
quick-xml = "0.41"
regex = "1"
