[package]
name = "reel-app"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.0"
librqbit = { version = "9.1.0", features = ["http-api", "tracing-subscriber-utils"] }
serde_json = "1"
anyhow = "1"
librqbit-dualstack-sockets = "0.7"
# Piece indices for the ring-buffer storage (the version librqbit uses).
librqbit-core = { version = "9.1.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "io-util"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "default-tls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
quick-xml = "0.41"
regex = "1"
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# The mpv video view (`src/mpv`): a native component on NSH's AppKit host.
nsh-platform-macos = { version = "0.5.0", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAOpenGLLayer", "objc2-open-gl", "objc2-core-video", "objc2-core-foundation"] }
objc2-open-gl = { version = "0.3", features = ["CGLTypes", "CGLCurrent"] }
objc2-core-video = { version = "0.3", features = ["CVBase"] }
objc2-core-foundation = { version = "0.3", features = ["CFDate"] }
