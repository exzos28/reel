[package]
name = "reel-tizen-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "reel's Rust core for Samsung TVs: app/'s modules over HTTP on 127.0.0.1"

[lib]
# cdylib: libreel_tizen_core.so, loaded by the .NET service (service/). rlib: for the desktop
# server (src/main.rs) and the tests.
name = "reel_tizen_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "reel-core"
path = "src/main.rs"

[dependencies]
reel-app = { path = "../../../app" }
reel-rpc = { path = "../rpc" }
axum.workspace = true
tokio.workspace = true
serde_json.workspace = true
libc = "0.2"
# No OpenSSL: app/ builds librqbit and reqwest with rustls, so the TV needs no system TLS library.
