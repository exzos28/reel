<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>reel</title>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    /* Dark from the first frame (the platform shows the page white until it paints); the
       shell clears it once the app is up, as AVPlay draws under a transparent page. */
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0e0e0f; color: #f5f5f5; font: 28px/1.4 sans-serif; }
    html.ready, html.ready body { background: transparent; }
    /* The splash: reel's logo and a thin running bar, until the app shows. */
    #splash { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 10; background: #0e0e0f;
              display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 400ms ease-out; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .logo { font: 700 168px/1 sans-serif; letter-spacing: -4px; color: #e5383b; }
    #splash .bar { position: relative; width: 220px; height: 4px; margin-top: 56px; border-radius: 2px; background: rgba(245,245,245,0.12); overflow: hidden; }
    #splash .bar i { position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 2px; background: rgba(245,245,245,0.7);
                     animation: run 1.2s ease-in-out infinite; }
    @keyframes run { from { left: -40%; } to { left: 100%; } }
    /* AVPlay draws on the video plane under the page: everything above it must be transparent. */
    #av { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #app { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: transparent; }
    #diag { position: absolute; left: 96px; top: 72px; right: 96px; padding: 32px 40px; background: rgba(15, 15, 15, 0.86); border-radius: 20px; }
    #diag h1 { margin: 0 0 16px; font-size: 44px; }
    #diag li { list-style: none; margin: 4px 0; }
    #diag .ok::before { content: "OK   "; color: #6c6; }
    #diag .fail::before { content: "FAIL "; color: #e5383b; }
    #diag .wait::before { content: "...  "; color: #8c8c8c; }
    #diag button { font: inherit; margin: 24px 16px 0 0; padding: 12px 28px; border-radius: 12px; border: 2px solid #4a4a4a; background: #2a2a2a; color: inherit; }
    #diag button:focus { border-color: #f5f5f5; outline: none; }
    #diag pre { white-space: pre-wrap; font-size: 20px; color: #c8c8c8; max-height: 360px; overflow: hidden; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="splash"><div class="logo">reel</div><div class="bar"><i></i></div></div>
  <object id="av" type="application/avplayer"></object>
  <div id="diag" class="hidden">
    <h1>reel on Tizen: diagnostics</h1>
    <ul id="steps"></ul>
    <button id="play">Play Sintel (AVPlay)</button><button id="stop">Stop</button>
    <pre id="log"></pre>
  </div>
  <!-- Written by ../build.sh: REEL_WEB = whether web/ holds the NSH build. -->
  <script src="shell-config.js"></script>
  <script src="shell.js"></script>
</body>
</html>
