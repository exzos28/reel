# Platform builds. Called by ci.yml (every push and PR) and release.yml (v* tags); every job
# runs scripts/build.sh <target>, which a developer runs the same way locally.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: App version for the packages (overrides nsh.json); empty keeps nsh.json's.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REEL_VERSION: ${{ inputs.version }}
  REEL_BUILD: ${{ github.run_number }}
  # Baked in by option_env!; empty (forks, no secret) means the app asks the user for a key.
  REEL_TMDB_TOKEN: ${{ secrets.REEL_TMDB_TOKEN }}

jobs:
  macos:
    runs-on: macos-15
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: macos
      - run: scripts/build.sh macos
      # Optional: Developer ID signing and notarization, only when the secrets exist.
      - if: env.APPLE_CERT_P12_BASE64 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          scripts/apple-signing.sh keychain
          scripts/apple-signing.sh macos
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-macos
          path: app/.nsh/dist/macos/reel-*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04 # GTK 4.14
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/setup-linux-deps.sh
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: linux
      - run: scripts/build.sh linux
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-linux
          path: app/.nsh/dist/linux/reel-*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: windows
      - run: scripts/build.sh windows
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-windows
          path: app/.nsh/dist/windows/reel-*
          if-no-files-found: error

  android:
    # NSH documents Android packaging from the prebuilt distribution on macOS and Windows.
    runs-on: macos-15
    # Expected to fail until app/Cargo.toml switches librqbit off its default openssl-backed
    # sha1 (openssl-sys has no OpenSSL to link for Android); see docs/ci.md.
    continue-on-error: true
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      REEL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - run: scripts/setup-android-sdk.sh
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: android
      # Release signing only when the keystore secret exists; otherwise the debug key.
      - if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "REEL_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: scripts/build.sh android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-android
          path: app/.nsh/dist/android/reel-*
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: ios-simulator
      # One universal .app (UIDeviceFamily 1 and 2, checked by the script).
      - run: scripts/build.sh ios-simulator
      - name: Launch on an iPhone simulator
        run: scripts/ios-sim-smoke.sh iPhone
      - name: Launch on an iPad simulator
        run: scripts/ios-sim-smoke.sh iPad
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-ios-simulator
          path: |
            app/.nsh/dist/ios-simulator/reel-*
            app/.nsh/dist/ios-simulator/screenshot-*.png
          if-no-files-found: error

  ios-device:
    # Optional: a signed .ipa, only when the signing secrets exist. Sideloading/TestFlight
    # only; the App Store does not accept a torrent client.
    runs-on: macos-15
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      REEL_IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
    steps:
      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "$APPLE_CERT_P12_BASE64" ] && [ -n "$IOS_PROFILE_BASE64" ] && [ -n "$REEL_IOS_SIGN_IDENTITY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::iOS device build skipped: APPLE_CERT_P12_BASE64, IOS_PROFILE_BASE64 or IOS_SIGN_IDENTITY is not set"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v7.0.1
      - if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: ios-device
      - if: steps.secrets.outputs.present == 'true'
        run: |
          scripts/apple-signing.sh keychain
          REEL_IOS_PROFILE="$(scripts/apple-signing.sh profile)"
          export REEL_IOS_PROFILE
          scripts/build.sh ios
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-ios
          path: app/.nsh/dist/ios/reel-*
          if-no-files-found: error

  # Tizen, step 1 of the plan: the NSH web build the Tizen shell's WebView shows.
  web:
    runs-on: ubuntu-24.04
    # Expected to fail for now: the crate does not build for wasm32-unknown-unknown
    # (tokio's net feature pulls in mio, which has no wasm32-unknown-unknown support); see docs/ci.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: web
      - run: scripts/build.sh web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-web
          path: app/.nsh/dist/web/reel-*
          if-no-files-found: error

  # Tizen, step 2: the Rust core as an armv7 soft-float shared library (toolchain smoke test).
  tizen-core-armv7:
    runs-on: ubuntu-24.04
    # Ubuntu has no armel port; Debian has the armel cross compiler and OpenSSL.
    container: debian:bookworm
    # A smoke test: linked against Debian's glibc, not the Tizen rootstrap yet; see docs/ci.md.
    continue-on-error: true
    steps:
      - name: Install git and zstd (checkout, caches)
        run: apt-get update && apt-get install -y --no-install-recommends git zstd ca-certificates
      - uses: actions/checkout@v7.0.1
      - run: scripts/setup-armv7-deps.sh
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app -> target
          key: armv7
      - run: scripts/build.sh armv7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-tizen-core-armv7
          path: app/.nsh/dist/armv7/reel-*
          if-no-files-found: error
      - name: "TODO: package the Tizen .tpk with Tizen Studio CLI (needs hosts/tizen)"
        if: hashFiles('hosts/tizen/**') != ''
        run: scripts/build.sh tpk
