# Platform builds. Called by ci.yml (a PR with the `build` label, a version PR, by hand) and
# release.yml (v* tags); every job runs build/build.sh <target>, which a developer runs the same
# way locally.
name: build

on:
  workflow_call:
    inputs:
      release:
        description: A release's build (a universal macOS app); the version is always app/nsh.json's.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Baked in by option_env!; empty (forks, no secret) means the app asks the user for a key.
  REEL_TMDB_TOKEN: ${{ secrets.REEL_TMDB_TOKEN }}
  # The partner's bot (a repository variable, not a secret): "Rent a ready source".
  REEL_PARTNER_BOT: ${{ vars.REEL_PARTNER_BOT }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # A release runs on Apple silicon and Intel Macs alike; other builds, this runner's only.
      REEL_MACOS_ARCH: ${{ inputs.release && 'universal' || '' }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: macos
      - run: build/build.sh macos
      # Optional: Developer ID signing and notarization, only when the secrets exist.
      - if: env.APPLE_CERT_P12_BASE64 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          build/apple-signing.sh keychain
          build/apple-signing.sh macos
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-macos
          path: app/.nsh/dist/macos/reel-*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04 # GTK 4.14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: build/setup-linux-deps.sh
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: linux
      - run: build/build.sh linux
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-linux
          path: app/.nsh/dist/linux/reel-*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: windows
      - run: build/build.sh windows
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-windows
          path: app/.nsh/dist/windows/reel-*
          if-no-files-found: error

  android:
    # NSH documents Android packaging from the prebuilt distribution on macOS and Windows.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      REEL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - run: build/setup-android-sdk.sh
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: android
      # Release signing only when the keystore secret exists; otherwise the debug key.
      - if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "REEL_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: build/build.sh android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-android
          path: app/.nsh/dist/android/reel-*
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: ios-simulator
      # One universal .app (UIDeviceFamily 1 and 2, checked by the script).
      - run: build/build.sh ios-simulator
      - name: Launch on an iPhone simulator
        run: dev/ios-sim-smoke.sh iPhone
      - name: Launch on an iPad simulator
        run: dev/ios-sim-smoke.sh iPad
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-ios-simulator
          path: |
            app/.nsh/dist/ios-simulator/reel-*
            app/.nsh/dist/ios-simulator/screenshot-*.png
          if-no-files-found: error

  ios-device:
    # Optional: a signed .ipa, only when the repository variable REEL_IOS_DEVICE is "true" and
    # the signing secrets exist (a job's `if` cannot read secrets, so without the variable the job
    # takes no macOS runner). Sideloading/TestFlight only; the App Store does not accept a torrent client.
    if: vars.REEL_IOS_DEVICE == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      REEL_IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
    steps:
      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "$APPLE_CERT_P12_BASE64" ] && [ -n "$IOS_PROFILE_BASE64" ] && [ -n "$REEL_IOS_SIGN_IDENTITY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::iOS device build skipped: APPLE_CERT_P12_BASE64, IOS_PROFILE_BASE64 or IOS_SIGN_IDENTITY is not set"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v7.0.1
      - if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: ios-device
      - if: steps.secrets.outputs.present == 'true'
        run: |
          build/apple-signing.sh keychain
          REEL_IOS_PROFILE="$(build/apple-signing.sh profile)"
          export REEL_IOS_PROFILE
          build/build.sh ios
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-ios
          path: app/.nsh/dist/ios/reel-*
          if-no-files-found: error

  # The NSH web build (the static site; the TV's UI is built the same way by tizen.yml).
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      # The crate is built for this Linux host too (its modules), which pulls in GTK.
      - run: build/setup-linux-deps.sh
      - uses: ./.github/actions/setup-nsh
        with:
          rust-cache-key: web
      # NSH's web runtime compiles C (zstd-sys) for wasm32: a clang with that backend and its llvm-ar.
      - name: Install clang for wasm32
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 llvm-18
          echo "CC_wasm32_unknown_unknown=/usr/lib/llvm-18/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=/usr/lib/llvm-18/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: build/build.sh web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-web
          path: app/.nsh/dist/web/reel-*
          if-no-files-found: error
