name: Tizen package

# Builds the TV hybrid package (web launcher + .NET service hosting the Rust core) with
# build/tizen.sh, the way tizen-os-ambilight's tv-package.yml does. The package is signed
# with the Tizen SDK's default certificate; Apps2Samsung re-signs it for each TV.
# A push builds the full package: the NSH web build of app/ (wasm32) served by the core. Run it by
# hand with shell_only for the diagnostics screen instead, which checks each step on the TV and
# plays Sintel through AVPlay.
on:
  workflow_dispatch:
    inputs:
      shell_only:
        description: Diagnostics shell only (no NSH web build)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - platforms/tizen/**
      - build/tizen.sh
      - app/**
      - .github/workflows/tizen.yml
  workflow_call:
    inputs:
      shell_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Hybrid .wgt
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TIZEN_SDK: /home/runner/tizen-sdk
      CARGO_TERM_COLOR: always
      # A push has no inputs: a missing one is not `true`, so it builds the full package.
      SHELL_ONLY: ${{ inputs.shell_only == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32: NSH's web build of app/ (the TV's UI).
          targets: armv7-unknown-linux-gnueabi,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms/tizen

      # The core's C parts (sqlite, TLS) are cross-compiled with zig, pinned to glibc 2.28 so the
      # library loads on the TV whatever glibc the runner has.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install the Tizen .NET workload
        run: |
          curl -fsSL -o "$RUNNER_TEMP/workload-install.sh" \
            https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh
          sudo bash "$RUNNER_TEMP/workload-install.sh" -d "$DOTNET_ROOT"
          dotnet workload list

      # Tizen-Core CLI (tz) from the official Tizen SDK package repository; versions and SHA256
      # as in tizen-os-ambilight's tv-package.yml.
      - name: Install Tizen-Core CLI
        run: |
          base=https://download.tizen.org/sdk/tizenstudio/official/binary
          mkdir -p "$TIZEN_SDK"
          while read -r file sha; do
            curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
            echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/$file" 'data/*' -d "$RUNNER_TEMP/pkg"
          done <<'EOF'
          tizen-core_10.0.18_ubuntu-64.zip 08b60e8f630fe0c3aafa5be9251a75d9ce173f2521375ddb803f9a3cb57f62ec
          web-privilege-checker_0.0.2_ubuntu-64.zip 5dce06d92b3f046303f3baabd1e8a4bb6cfb7724e051da5d83205fd6d88f7ccc
          certificate-generator_0.1.4_ubuntu-64.zip 446aa52f249205f4ad573173b02c9c38aa5de0316028b77dd189e44fd5f75964
          EOF
          cp -R "$RUNNER_TEMP/pkg/data/." "$TIZEN_SDK/"
          printf 'TIZEN_SDK_INSTALLED_PATH=%s\nTIZEN_SDK_DATA_PATH=%s\n' "$TIZEN_SDK" "$TIZEN_SDK-data" > "$TIZEN_SDK/sdk.info"
          mkdir -p "$TIZEN_SDK-data"
          chmod +x "$TIZEN_SDK"/tools/tizen-core/{tz,tgn,ninja,web-privilege-checker}
          "$TIZEN_SDK/tools/tizen-core/tz" --version

      # The NSH web build is only needed for the full package.
      - uses: ./.github/actions/setup-nsh
        if: env.SHELL_ONLY != 'true'
        with:
          rust-cache-key: tizen-web

      # The NSH web build also builds the crate for this Linux host, which pulls in GTK.
      - name: Install the Linux development packages
        if: env.SHELL_ONLY != 'true'
        run: build/setup-linux-deps.sh

      # NSH's web runtime compiles C (zstd-sys) for wasm32: a clang with that backend and its
      # llvm-ar (build.sh takes llvm-ar from the clang's directory).
      - name: Install clang for wasm32
        if: env.SHELL_ONLY != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 llvm-18
          echo "CC_wasm32_unknown_unknown=/usr/lib/llvm-18/bin/clang" >> "$GITHUB_ENV"
          echo 'int x;' | /usr/lib/llvm-18/bin/clang --target=wasm32-unknown-unknown -c -x c - -o /dev/null
          ls -l /usr/lib/llvm-18/bin/llvm-ar

      # Informational: `package` itself fails on whatever it needs and lacks.
      - name: Check the tools
        run: build/tizen.sh check || true

      - name: Build the package
        env:
          REEL_TMDB_TOKEN: ${{ secrets.REEL_TMDB_TOKEN }}
          # The partner's bot (a repository variable, not a secret): "Rent a ready source".
          REEL_PARTNER_BOT: ${{ vars.REEL_PARTNER_BOT }}
        run: |
          if [ "$SHELL_ONLY" = "true" ]; then
            build/tizen.sh package --shell-only out/tizen
          else
            build/tizen.sh package out/tizen
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: reel-tv
          path: out/tizen/
          if-no-files-found: error
