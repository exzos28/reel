# PRs and main: the checks (checks.yml), which main's branch protection requires before a merge.
# The platform builds (build.yml, tizen.yml) are not run on every change: on a PR with the
# `build` label, on a version PR (branch release/*), by hand, and on a release (release.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      build:
        description: Also build every platform
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to a PR replaces its run; on main every commit keeps its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build) ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'build') || startsWith(github.head_ref, 'release/')))
    uses: ./.github/workflows/build.yml
    secrets: inherit

  tv:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build) ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'build') || startsWith(github.head_ref, 'release/')))
    uses: ./.github/workflows/tizen.yml
    secrets: inherit
